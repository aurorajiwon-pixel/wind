<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>☁️ 바람이의 대모험 · 2차시</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#3f3d56;background:linear-gradient(180deg,#bfe9ff 0%,#e9f7ff 45%,#fff4dc 100%);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.screen{display:none;min-height:100vh}.screen.on{display:block}
/* 시작 */
#start{display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}
#start.on{display:flex}
.title{font-size:54px;color:#2563eb;text-shadow:3px 3px 0 #fff,6px 6px 0 #bae6fd;margin:10px 0}
.sub{font-size:22px;color:#64748b;margin-bottom:24px}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 0 #cbe7f7,0 16px 30px rgba(56,189,248,.18);padding:24px}
.inp{font-family:inherit;font-size:22px;padding:12px 16px;border:3px solid #bae6fd;border-radius:16px;width:100%;margin:6px 0;outline:none;text-align:center}
.inp:focus{border-color:#38bdf8}
.big{font-size:24px;padding:14px 34px;border:none;border-radius:20px;color:#fff;background:#fb7185;box-shadow:0 6px 0 #e11d48;transition:.1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #e11d48}
.big.blue{background:#38bdf8;box-shadow:0 6px 0 #0284c7}
.big.green{background:#34d399;box-shadow:0 6px 0 #059669}
.big:disabled{background:#cbd5e1;box-shadow:0 6px 0 #94a3b8;cursor:default}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
/* 상단바 */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:8px 18px;font-size:19px;box-shadow:0 4px 0 #cbe7f7}
.back{border:none;background:#fff;border-radius:999px;padding:8px 18px;font-size:18px;box-shadow:0 4px 0 #cbe7f7;color:#3f3d56}
/* 지도 */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;padding:10px 30px 30px;max-width:1200px;margin:auto}
.isle{position:relative;border:none;background:#fff;border-radius:30px;padding:22px 16px;box-shadow:0 10px 0 #cbe7f7;text-align:center;font-size:18px;color:#3f3d56;transition:.15s}
.isle:hover:not(.lock){transform:translateY(-6px) rotate(-1deg)}
.isle .ic{font-size:64px;display:block;margin-bottom:6px}
.isle h3{font-size:24px;margin-bottom:4px}
.isle .st{font-size:26px;letter-spacing:2px;margin-top:6px}
.isle.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.isle.done{box-shadow:0 10px 0 #fde68a;background:#fffbeb}
.isle .num{position:absolute;top:-12px;left:-12px;background:#fb7185;color:#fff;border-radius:50%;width:44px;height:44px;line-height:44px;font-size:22px}
/* 스테이지 */
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:0 22px 22px;max-width:1400px;margin:auto}
@media(max-width:980px){.stagewrap{grid-template-columns:1fr}}
.cvbox{background:#fff;border-radius:28px;box-shadow:0 10px 0 #cbe7f7;padding:10px;position:relative}
canvas{width:100%;display:block;border-radius:20px}
.side{display:flex;flex-direction:column;gap:12px}
.mascot{display:flex;gap:10px;align-items:flex-start}
.mascot svg{flex:0 0 74px}
.bubble{background:#fff;border-radius:20px;padding:12px 14px;font-size:17px;line-height:1.5;box-shadow:0 5px 0 #cbe7f7;position:relative;flex:1;min-height:70px}
.bubble:before{content:'';position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.goal{background:#fef3c7;border-radius:18px;padding:12px 14px;font-size:17px;line-height:1.5;border:3px dashed #fbbf24}
.ctrl{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #cbe7f7;display:flex;flex-direction:column;gap:10px}
.ctrl label{font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:3px solid #bae6fd;background:#fff;border-radius:14px;padding:8px 12px;font-size:16px;color:#3f3d56;flex:1}
.tog.on{background:#38bdf8;border-color:#38bdf8;color:#fff}
.opt{border:3px solid #e2e8f0;background:#fff;border-radius:16px;padding:10px 12px;font-size:17px;color:#3f3d56;text-align:left;width:100%}
.opt:hover{border-color:#38bdf8}
.opt.right{background:#dcfce7;border-color:#34d399}
.opt.wrong{background:#ffe4e6;border-color:#fb7185;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input[type=range]{-webkit-appearance:none;width:100%;height:16px;border-radius:10px;background:linear-gradient(90deg,#bae6fd,#fbcfe8);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid #fb7185;cursor:pointer}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid #fb7185}
.val{font-size:26px;color:#fb7185;text-align:center}
.lv{display:flex;gap:6px;justify-content:center}
.lv span{width:38px;height:38px;border-radius:50%;background:#e2e8f0;line-height:38px;text-align:center;font-size:18px;color:#fff}
.lv span.cur{background:#38bdf8}.lv span.ok{background:#34d399}
.formula{background:#eff6ff;border-radius:16px;padding:12px;font-size:18px;text-align:center;line-height:1.7;border:3px solid #bfdbfe}
.legend{font-size:15px;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.legend i{display:inline-block;width:20px;height:6px;border-radius:3px;vertical-align:middle;margin-right:5px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:30px;padding:28px;max-width:560px;width:100%;text-align:center;box-shadow:0 12px 0 #cbe7f7;animation:pop .35s}
@keyframes pop{0%{transform:scale(.6)}80%{transform:scale(1.05)}100%{transform:scale(1)}}
.mbox h2{font-size:32px;color:#2563eb;margin-bottom:8px}
.mbox p{font-size:19px;line-height:1.6;margin:8px 0}
.bigstar{font-size:60px;letter-spacing:6px;margin:10px 0}
.bigstar .off{filter:grayscale(1);opacity:.3}
.code{font-family:monospace;font-size:13px;word-break:break-all;background:#f1f5f9;border-radius:12px;padding:12px;margin:10px 0;user-select:all;text-align:left}
.conf{position:fixed;top:-40px;font-size:30px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.qnum{color:#94a3b8;font-size:16px}
.badge{display:inline-block;background:#fef3c7;border-radius:999px;padding:4px 12px;font-size:15px;margin:2px}
</style>
</head>
<body>

<!-- ===== 시작 화면 ===== -->
<section id="start" class="screen on">
  <div class="float" id="bigMascot"></div>
  <div class="title">바람이의 대모험</div>
  <div class="sub">지구시스템과학 · 2차시 「바람에 힘이 하나씩 더해지면」</div>
  <div class="card" style="width:min(420px,92vw)">
    <input class="inp" id="inNum" placeholder="번호 (예: 7)" inputmode="numeric">
    <input class="inp" id="inName" placeholder="이름">
    <div style="height:10px"></div>
    <button class="big" id="btnStart">모험 시작! ✨</button>
  </div>
</section>

<!-- ===== 지도 ===== -->
<section id="map" class="screen">
  <div class="top">
    <div class="pill" id="who">🙂</div>
    <div class="pill" id="starTotal">⭐ 0 / 12</div>
    <button class="back" id="btnSubmitTop">📮 선생님께 제출</button>
  </div>
  <div style="text-align:center;font-size:30px;color:#2563eb;margin:4px 0 14px">🗺️ 바람이가 하늘 왕국을 여행해요</div>
  <div class="map" id="mapGrid"></div>
</section>

<!-- ===== 스테이지 ===== -->
<section id="stage" class="screen">
  <div class="top">
    <button class="back" id="btnBack">◀ 지도로</button>
    <div class="pill" id="stTitle"></div>
    <div class="pill" id="stTry">시도 0</div>
  </div>
  <div class="stagewrap">
    <div class="cvbox"><canvas id="cv" width="900" height="580"></canvas></div>
    <div class="side">
      <div class="mascot"><div id="miniMascot"></div><div class="bubble" id="say"></div></div>
      <div class="goal" id="goal"></div>
      <div class="ctrl" id="ctrl"></div>
    </div>
  </div>
</section>

<!-- ===== 모달 ===== -->
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
/* ============ 공통 ============ */
const $=id=>document.getElementById(id);
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
const cv=$('cv'),ctx=cv.getContext('2d'),W=900,H=580;
const COL={pgf:'#f43f5e',cor:'#3b82f6',fri:'#10b981',cen:'#f59e0b',vel:'#8b5cf6'};
const STAGES=[
 {ic:'🎠',name:'빙글빙글 마을',sub:'전향력의 비밀'},
 {ic:'🎈',name:'균형 비행',sub:'지균풍'},
 {ic:'🏎️',name:'궤도 레이스',sub:'경도풍'},
 {ic:'🌾',name:'땅 위의 바람',sub:'지상풍'}];
let S={name:'',num:'',stars:[0,0,0,0],att:[0,0,0,0],quiz:'--------',done:[0,0,0,0],t0:Date.now()};
function save(){localStorage.setItem('baram2_'+S.num+'_'+S.name,JSON.stringify(S));}

function cloudSVG(size,mood='happy'){
  const mouth=mood==='wow'?'<ellipse cx="50" cy="62" rx="6" ry="7" fill="#3f3d56"/>':
    mood==='sad'?'<path d="M42 66 Q50 58 58 66" stroke="#3f3d56" stroke-width="4" fill="none" stroke-linecap="round"/>':
    '<path d="M41 59 Q50 69 59 59" stroke="#3f3d56" stroke-width="4" fill="none" stroke-linecap="round"/>';
  return `<svg width="${size}" height="${size*0.8}" viewBox="0 0 100 80"><g>
  <circle cx="30" cy="48" r="20" fill="#fff"/><circle cx="52" cy="36" r="26" fill="#fff"/><circle cx="74" cy="48" r="19" fill="#fff"/>
  <rect x="22" y="44" width="60" height="24" rx="12" fill="#fff"/>
  <path d="M10 48 a20 20 0 0 1 20 -20 a26 26 0 0 1 48 0 a19 19 0 0 1 12 38 H22 a20 20 0 0 1 -12 -18z" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <circle cx="40" cy="48" r="4.5" fill="#3f3d56"/><circle cx="60" cy="48" r="4.5" fill="#3f3d56"/>
  <circle cx="41.5" cy="46.5" r="1.5" fill="#fff"/><circle cx="61.5" cy="46.5" r="1.5" fill="#fff"/>
  <ellipse cx="32" cy="57" rx="5" ry="3" fill="#fda4af"/><ellipse cx="68" cy="57" rx="5" ry="3" fill="#fda4af"/>${mouth}</g></svg>`;
}
$('bigMascot').innerHTML=cloudSVG(180);
function say(t,mood='happy'){$('say').innerHTML=t;$('miniMascot').innerHTML=cloudSVG(74,mood);}
function confetti(n=40){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='conf';
  e.textContent=['⭐','✨','🎉','💖','☁️','🌈'][i%6];e.style.left=Math.random()*100+'vw';
  e.style.animationDuration=(1.6+Math.random()*1.8)+'s';e.style.animationDelay=Math.random()*.5+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),4200);}}
function modal(h){$('mbox').innerHTML=h;$('modal').classList.add('on');}
function closeModal(){$('modal').classList.remove('on');}

/* 캔버스 그리기 도구 */
function arrow(x,y,dx,dy,c,w=6,label){const L=Math.hypot(dx,dy);if(L<4)return;
  ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  const a=Math.atan2(dy,dx),h=Math.min(18,L*.45);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx-h*.6*Math.cos(a),y+dy-h*.6*Math.sin(a));ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-h*Math.cos(a-.5),y+dy-h*Math.sin(a-.5));
  ctx.lineTo(x+dx-h*Math.cos(a+.5),y+dy-h*Math.sin(a+.5));ctx.closePath();ctx.fill();
  if(label){ctx.font='18px Jua, sans-serif';ctx.textAlign='center';
    ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(label,x+dx+18*Math.cos(a),y+dy+18*Math.sin(a)+6);
    ctx.fillText(label,x+dx+18*Math.cos(a),y+dy+18*Math.sin(a)+6);}
  ctx.restore();}
function txt(t,x,y,c='#3f3d56',s=20,al='left',stroke=true){ctx.save();ctx.font=s+'px Jua, sans-serif';ctx.textAlign=al;
  if(stroke){ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(t,x,y);}ctx.fillStyle=c;ctx.fillText(t,x,y);ctx.restore();}
function cloud(x,y,s=1,face=true){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.strokeStyle='#7dd3fc';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(-12,4,12,0,7);ctx.arc(2,-6,15,0,7);ctx.arc(16,4,11,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-12,4,12,Math.PI*.5,Math.PI*1.6);ctx.arc(2,-6,15,Math.PI*1.1,Math.PI*1.95);ctx.arc(16,4,11,Math.PI*1.4,Math.PI*.5);ctx.closePath();ctx.stroke();ctx.fill();
  if(face){ctx.fillStyle='#3f3d56';ctx.beginPath();ctx.arc(-4,2,2.4,0,7);ctx.arc(8,2,2.4,0,7);ctx.fill();
    ctx.fillStyle='#fda4af';ctx.beginPath();ctx.arc(-9,7,2.5,0,7);ctx.arc(13,7,2.5,0,7);ctx.fill();}
  ctx.restore();}
function sky(top='#dbf1ff',bot='#fffaf0'){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function legend(keys){const nm={pgf:'기압 경도력',cor:'전향력',fri:'마찰력',cen:'합력(구심력)',vel:'바람 방향'};
  return '<div class="legend">'+keys.map(k=>`<div><i style="background:${COL[k]}"></i>${nm[k]}</div>`).join('')+'</div>';}

/* 루프 */
let frame=null,raf=0,last=0;
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(frame)frame(dt);raf=requestAnimationFrame(loop);}
raf=requestAnimationFrame(loop);

/* ============ 화면 전환 ============ */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
$('btnStart').onclick=()=>{
  const n=$('inName').value.trim(),no=$('inNum').value.trim();
  if(!n||!no){$('inName').placeholder='이름을 꼭 써 주세요!';return;}
  const old=localStorage.getItem('baram2_'+no+'_'+n);
  S=old?JSON.parse(old):{name:n,num:no,stars:[0,0,0,0],att:[0,0,0,0],quiz:'--------',done:[0,0,0,0],t0:Date.now()};
  save();renderMap();show('map');};
function renderMap(){
  $('who').textContent=`${S.num}번 ${S.name}`;
  const tot=S.stars.reduce((a,b)=>a+b,0);$('starTotal').textContent=`⭐ ${tot} / 12`;
  $('mapGrid').innerHTML=STAGES.map((st,i)=>{
    const lock=i>0&&!S.done[i-1],done=S.done[i];
    const stars=[0,1,2].map(k=>k<S.stars[i]?'⭐':'<span style="opacity:.25">⭐</span>').join('');
    return `<button class="isle ${lock?'lock':''} ${done?'done':''}" data-i="${i}"><span class="num">${i+1}</span>
      <span class="ic">${lock?'🔒':st.ic}</span><h3>${st.name}</h3><div>${st.sub}</div><div class="st">${stars}</div></button>`;}).join('')+
    `<button class="isle ${S.done.every(x=>x)?'':'lock'}" id="isleEnd"><span class="ic">🏆</span><h3>모험 완료!</h3><div>선생님께 기록 제출</div></button>`;
  document.querySelectorAll('.isle[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>0&&!S.done[i-1]){b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:250});return;}openStage(i);});
  $('isleEnd').onclick=()=>{if(S.done.every(x=>x))submit();};
}
$('btnBack').onclick=()=>{frame=null;renderMap();show('map');};
$('btnSubmitTop').onclick=submit;

let cur=0,tries=0;
function setTry(){$('stTry').textContent='시도 '+tries;}
function openStage(i){cur=i;tries=0;setTry();$('stTitle').textContent=`${STAGES[i].ic} ${i+1}. ${STAGES[i].name}`;
  show('stage');[stage1,stage2,stage3,stage4][i]();}

/* 스테이지 클리어 → 퀴즈 → 저장 */
function clearStage(stars,extra=''){
  S.att[cur]=tries;S.stars[cur]=Math.max(S.stars[cur],stars);save();confetti();
  const st=[0,1,2].map(k=>k<stars?'⭐':'<span class="off">⭐</span>').join('');
  modal(`<h2>스테이지 클리어! 🎉</h2><div class="bigstar">${st}</div><p>${extra}</p><p>마지막으로 바람이의 퀴즈 2개!</p><button class="big blue" id="goQuiz">퀴즈 풀기 ▶</button>`);
  $('goQuiz').onclick=()=>quiz(0);
}
const QUIZ=[
 [{q:'북반구에서 움직이는 물체는 진행 방향의 어느 쪽으로 휘어 보일까?',o:['왼쪽','오른쪽','휘지 않아요'],a:1,e:'북반구에서 전향력은 운동 방향의 <b>오른쪽</b>으로 작용해요.'},
  {q:'전향력이 가장 큰 곳은?',o:['적도','중위도','극'],a:2,e:'위도가 높을수록 전향력이 커져요 (적도에서는 0).'}],
 [{q:'지균풍은 어떤 두 힘이 균형을 이룰 때 부는 바람일까?',o:['기압 경도력 + 마찰력','기압 경도력 + 전향력','전향력 + 마찰력'],a:1,e:'기압 경도력 = 전향력 → 등압선과 나란히!'},
  {q:'등압선 간격이 좁아지면 지균풍은?',o:['빨라진다','느려진다','그대로다'],a:0,e:'기압 경도력이 커지면, 맞서는 전향력도 커져야 → 바람이 빨라야 해요.'}],
 [{q:'기압 경도력이 같을 때 가장 빠른 바람은?',o:['저기압성 경도풍','지균풍','고기압성 경도풍'],a:2,e:'고기압성 > 지균풍 > 저기압성!'},
  {q:'고기압 둘레를 돌 때, 안쪽으로 끌어당기는 힘은?',o:['기압 경도력','전향력','마찰력'],a:1,e:'고기압에서는 기압 경도력이 바깥쪽! 안쪽으로 끄는 건 전향력이라 전향력이 더 커야 해요 → 바람이 빨라요.'}],
 [{q:'마찰이 큰 육지에서 바람은 등압선을 어떻게 지날까?',o:['나란하게','저기압 쪽으로 더 많이 기울어서','고기압 쪽으로 기울어서'],a:1,e:'마찰 → 느려짐 → 전향력 약해짐 → 기압 경도력이 이겨서 저기압 쪽으로!'},
  {q:'지상 저기압 중심에 모여든 공기는?',o:['위로 올라간다','아래로 내려간다','사라진다'],a:0,e:'모인 공기는 상승! 올라간 공기는 어떻게 될까? → 3차시에 계속 ☁️'}]];
function quiz(k){
  const Q=QUIZ[cur][k];let first=true;
  modal(`<div class="qnum">퀴즈 ${k+1} / 2</div><h2 style="font-size:24px;margin:10px 0">${Q.q}</h2>
   <div style="display:flex;flex-direction:column;gap:8px">${Q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><p id="qe"></p>`);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,idx=cur*2+k;
    if(i===Q.a){b.classList.add('right');
      if(S.quiz[idx]==='-'){S.quiz=S.quiz.slice(0,idx)+(first?'O':'X')+S.quiz.slice(idx+1);}save();
      $('qe').innerHTML='✅ '+Q.e+'<br><br><button class="big green" id="qn">'+(k===0?'다음 문제':'완료!')+'</button>';
      $('qn').onclick=()=>{if(k===0)quiz(1);else{S.done[cur]=1;save();closeModal();frame=null;renderMap();show('map');}};
    }else{first=false;b.classList.add('wrong');}
  });
}

/* 제출 코드 */
function makeCode(){
  const o={n:S.name,no:S.num,s:S.stars,a:S.att,q:S.quiz,d:S.done,m:Math.round((Date.now()-S.t0)/60000),t:Date.now()};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  let cs=0;for(const ch of b)cs=(cs*31+ch.charCodeAt(0))%46655;
  return 'BR2:'+b+':'+cs.toString(36);}
function submit(){
  const code=makeCode();
  modal(`<h2>📮 선생님께 제출</h2><p>아래 코드를 <b>복사</b>해서 선생님이 알려 준 곳(Amplify 화면 등)에 <b>붙여 넣어</b> 주세요.</p>
   <div class="code" id="codeBox">${code}</div>
   <div class="row" style="justify-content:center"><button class="big blue" id="cp">📋 복사하기</button><button class="big" id="cl">닫기</button></div><p id="cpm"></p>`);
  $('cp').onclick=()=>{navigator.clipboard.writeText(code).then(()=>$('cpm').textContent='복사 완료! 붙여 넣기 하세요 ✨',()=>{
    const r=document.createRange();r.selectNode($('codeBox'));getSelection().removeAllRanges();getSelection().addRange(r);$('cpm').textContent='코드가 선택되었어요. Ctrl+C 로 복사!';});};
  $('cl').onclick=closeModal;}

/* ============ STAGE 1 · 빙글빙글 마을 (전향력) ============ */
function stage1(){
  const R=[{w:0,name:'🌴 적도 마을',d:'땅이 돌지 않는 마을'},{w:.42,name:'🏡 중위도 마을',d:'땅이 천천히 도는 마을'},{w:.8,name:'🐧 극 마을',d:'땅이 빨리 도는 마을'}];
  let ri=0,aimDeg=0,view='disk',ball=null,clock=0,lock=false;
  const cx=W/2,cy=H/2+20,RAD=225,SP=165;
  $('goal').innerHTML='🎯 <b>미션</b> : 가운데의 바람이가 테두리의 친구 🐥 에게 편지 공을 던져요. 땅(원판)이 <b>반시계 방향</b>으로 돌아요 (북반구처럼!). 3개 마을에서 모두 배달 성공하기!';
  $('ctrl').innerHTML=`<div class="lv" id="lv"></div><div style="text-align:center;font-size:20px" id="rname"></div>
   <label>조준 방향</label><input type="range" id="aim" min="-70" max="70" value="0"><div class="val" id="aimT">정면</div>
   <button class="big" id="fire">🎈 던지기!</button>
   <div class="row"><button class="tog on" id="vD">🧍 마을 사람 눈</button><button class="tog" id="vS">🚀 우주에서 보기</button></div>`;
  const setR=()=>{$('rname').textContent=R[ri].name+' · '+R[ri].d;
    $('lv').innerHTML=R.map((_,i)=>`<span class="${i<ri?'ok':i===ri?'cur':''}">${i<ri?'✓':i+1}</span>`).join('');ball=null;};
  setR();say(ri===0?'먼저 적도 마을! 땅이 안 도니까 정면으로 던지면 되겠지? 😊':'');
  $('aim').oninput=e=>{aimDeg=+e.target.value;$('aimT').textContent=aimDeg===0?'정면':aimDeg<0?`왼쪽으로 ${-aimDeg}°`:`오른쪽으로 ${aimDeg}°`;};
  $('vD').onclick=()=>{view='disk';$('vD').classList.add('on');$('vS').classList.remove('on');};
  $('vS').onclick=()=>{view='space';$('vS').classList.add('on');$('vD').classList.remove('on');};
  $('fire').onclick=()=>{if(lock||(ball&&!ball.end))return;tries++;setTry();
    ball={a:-Math.PI/2+aimDeg*Math.PI/180,t:0,t0:clock,w:R[ri].w,end:false};};
  frame=dt=>{
    clock+=dt;const w=R[ri].w,phi=-w*clock;
    if(ball&&!ball.end){ball.t+=dt;if(SP*ball.t>=RAD){ball.t=RAD/SP;ball.end=true;judge();}}
    sky('#e0f2fe','#fef9c3');
    // 별 배경
    ctx.save();ctx.translate(cx,cy);
    const rot=view==='space'?phi:0;ctx.rotate(rot);
    // 원판
    const g=ctx.createRadialGradient(0,0,20,0,0,RAD+20);g.addColorStop(0,'#bbf7d0');g.addColorStop(1,'#86efac');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,RAD+18,0,7);ctx.fill();
    ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.stroke();
    for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.fillStyle=i%2?'#fde68a':'#fbcfe8';ctx.beginPath();ctx.arc((RAD-30)*Math.cos(a),(RAD-30)*Math.sin(a),9,0,7);ctx.fill();}
    ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('🐥',0,-RAD+12);
    ctx.font='24px serif';ctx.fillText('🌳',RAD*.55,RAD*.4);ctx.fillText('🏠',-RAD*.5,RAD*.45);ctx.fillText('🌷',-RAD*.55,-RAD*.25);
    ctx.restore();
    // 회전 표시
    if(w){ctx.save();ctx.strokeStyle='#f472b6';ctx.lineWidth=5;ctx.setLineDash([10,8]);ctx.lineDashOffset=clock*40;ctx.beginPath();ctx.arc(cx,cy,RAD+34,-.4,-1.4,true);ctx.stroke();ctx.restore();
      const ea=-1.4;arrow(cx+(RAD+34)*Math.cos(ea),cy+(RAD+34)*Math.sin(ea),-14,-3,'#f472b6',5);txt('반시계 회전',cx+RAD*.62,cy-RAD-34,'#db2777',18);}
    // 조준선
    if(!ball||ball.end){const a=-Math.PI/2+aimDeg*Math.PI/180;ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+RAD*Math.cos(a),cy+RAD*Math.sin(a));ctx.stroke();ctx.restore();}
    // 공 궤적
    if(ball){ctx.save();ctx.strokeStyle='#fb7185';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();
      let px,py;for(let s=0;s<=ball.t+1e-6;s+=.02){const sAng=view==='space'?ball.a+(-ball.w*ball.t0):ball.a+ball.w*s;
        // space 보기: 직선 (던진 순간 원판 각도 기준 → 현재 화면에서도 고정)
        const ang=view==='space'?ball.a-ball.w*ball.t0+0:sAng;px=cx+SP*s*Math.cos(ang);py=cy+SP*s*Math.sin(ang);s?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.stroke();ctx.restore();ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('💌',px,py+9);}
    cloud(cx,cy,1.5);
    txt(view==='disk'?'🧍 마을 사람이 본 모습':'🚀 우주에서 본 모습',20,36,'#2563eb',24);
    if(view==='space'&&w)txt('우주에서 보면 공은 똑바로! 땅이 돌아간 거예요',20,66,'#64748b',17);
  };
  // 우주 보기에서 원판 회전을 정확히 맞추기 위해: 던진 순간 원판각도 = -w*t0, 공의 우주 방향 = a + (-w*t0)
  // 화면 회전 rot=phi(현재) → 공 경로는 우주 고정 방향이므로 화면에서도 a - w*t0 방향 (원판만 돌아감)
  function judge(){
    const endAng=ball.a+ball.w*ball.t; // 원판 기준 도착 각도
    let d=(endAng+Math.PI/2)*180/Math.PI;
    if(Math.abs(d)<=7){lock=true;confetti(25);say(['배달 성공! 땅이 안 돌면 공은 똑바로 가요 🎉','성공!! 공이 <b>오른쪽으로 휘는 걸</b> 미리 생각하고 왼쪽을 겨눴구나! 🤩','극 마을까지 성공! 땅이 빨리 돌수록 더 많이 휘어요 🐧'][ri],'wow');
      setTimeout(()=>{lock=false;if(cur!==0||!$('rname'))return;ri++;if(ri<3){setR();say(ri===1?'이번엔 땅이 돌아요! 똑같이 정면으로 던지면 어떻게 될까? 🤔':'극 마을은 땅이 엄청 빨리 돌아요! 💨');}
        else{clearStage(tries<=5?3:tries<=9?2:1,'공이 오른쪽으로 휘어 보이게 하는 힘 = <b>전향력</b><br>· 북반구: 진행 방향의 <b>오른쪽</b><br>· 땅이 빨리 돌수록(고위도일수록) 크다<br>· 움직이는 것에만 작용한다');}},1800);}
    else if(d>0)say(`앗, 친구의 <b>오른쪽</b>으로 ${Math.round(d)}° 빗나갔어! ${ri?'공이 오른쪽으로 휘어 보이네… 🚀 우주에서 보기로 확인해 볼까? 그리고 조금 더 <b>왼쪽</b>을 겨눠 봐!':'조금 더 왼쪽!'}`,'sad');
    else say(`이번엔 친구의 <b>왼쪽</b>으로 ${Math.round(-d)}° 빗나갔어. 너무 왼쪽을 겨눴나 봐!`,'sad');
  }
}

/* ============ STAGE 2 · 균형 비행 (지균풍) ============ */
function stage2(){
  const L=[{G:90,lat:45,gap:110,name:'Lv1 · 기본 하늘'},{G:150,lat:45,gap:66,name:'Lv2 · 등압선이 촘촘한 하늘'},{G:90,lat:70,gap:110,name:'Lv3 · 북쪽 높은 위도 하늘'}];
  const f0=.6,LANE=52,X0=70,Y0=H/2;
  let li=0,p=null,demo=false,spd=20,trail=[],t=0;
  const fOf=l=>f0*Math.sin(l.lat*Math.PI/180)/Math.sin(Math.PI/4);
  $('goal').innerHTML='🎯 <b>미션</b> : 상공 5.5 km! 풍선 공기를 <b>노란 길</b>에서 벗어나지 않게 오른쪽 🏁 까지 날려요. 북쪽(위)이 저기압이에요. <b>출발 속도</b>를 잘 골라야 해요!';
  $('ctrl').innerHTML=`<div class="lv" id="lv"></div><div style="text-align:center;font-size:20px" id="lname"></div>
    <button class="tog" id="demo">🧪 먼저 실험: 멈춘 공기를 그냥 놓으면?</button>
    <label>출발 속도</label><input type="range" id="spd" min="5" max="70" value="20"><div class="val" id="spdT">20 m/s</div>
    <button class="big" id="fly">🎈 날려라!</button>${legend(['pgf','cor','vel'])}
    <div class="formula" id="fm" style="display:none"></div>`;
  const setL=()=>{$('lname').textContent=L[li].name;$('lv').innerHTML=L.map((_,i)=>`<span class="${i<li?'ok':i===li?'cur':''}">${i<li?'✓':i+1}</span>`).join('');p=null;trail=[];};
  setL();say('먼저 🧪 <b>실험</b> 버튼을 눌러 봐! 멈춰 있던 공기를 놓으면 어디로 갈까? 저기압 쪽으로 곧장 갈까? 🤔');
  $('spd').oninput=e=>{spd=+e.target.value;$('spdT').textContent=spd+' m/s';};
  $('demo').onclick=()=>{demo=true;t=0;trail=[];p={x:X0+40,y:Y0+60,vx:0,vy:0,end:false};say('지켜봐! 처음엔 저기압(위) 쪽으로 출발하는데…');};
  $('fly').onclick=()=>{demo=false;tries++;setTry();t=0;trail=[];p={x:X0,y:Y0,vx:spd*5,vy:0,end:false};say('날아라~! 🎈');};
  frame=dt=>{
    const l=L[li],f=fOf(l),G=l.G;
    if(p&&!p.end){t+=dt;
      for(let i=0;i<8;i++){const h=dt*1.8/8;
        const k=demo?1.1*Math.exp(-t/2.2):0;
        const ax=f*(-p.vy)-k*p.vx, ay=-G+f*p.vx-k*p.vy;
        p.vx+=ax*h;p.vy+=ay*h;p.x+=p.vx*h;p.y+=p.vy*h;}
      trail.push([p.x,p.y]);
      if(demo){if(p.x>W-40||p.y<20||t>6){p.end=true;say('봤지? 처음엔 저기압 쪽으로 가다가 <b>오른쪽으로 휘어서</b> 결국 <b>등압선과 나란히</b> 날아가! 전향력이 기압 경도력과 똑같아질 때까지 휘는 거야. 이제 미션 시작! 🎈','wow');}}
      else{
        if(Math.abs(p.y-Y0)>LANE){p.end=true;

          else say('앗, <b>고기압(아래)</b> 쪽으로 밀려났어! <b>전향력</b>이 너무 셌나 봐. 속도를 <b>낮춰</b> 볼까?','sad');}
        else if(p.x>W-60){p.end=true;win();}
      }}
    // 그리기
    sky('#e0f2fe','#f0f9ff');
    ctx.fillStyle='rgba(254,226,226,.6)';ctx.fillRect(0,0,W,50);ctx.fillStyle='rgba(219,234,254,.7)';ctx.fillRect(0,H-46,W,46);
    txt('🌀 저기압 쪽 (북)',W/2,34,'#e11d48',24,'center');txt('☀️ 고기압 쪽 (남)',W/2,H-14,'#2563eb',24,'center');
    if(!demo){ctx.fillStyle='rgba(253,224,71,.35)';ctx.fillRect(X0,Y0-LANE,W-X0-40,LANE*2);
      ctx.font='34px serif';ctx.fillText('🏁',W-62,Y0+12);}
    for(let i=-4;i<=4;i++){const y=Y0+i*l.gap+l.gap/2;if(y<55||y>H-50)continue;
      ctx.strokeStyle='#93c5fd';ctx.lineWidth=3;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      txt((5700-Math.round((i+.5)*2)*30)+' m',10,y-6,'#60a5fa',15);}
    if(trail.length){ctx.strokeStyle='#f472b6';ctx.lineWidth=5;ctx.lineCap='round';ctx.setLineDash([2,10]);ctx.beginPath();trail.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([]);}
    const P=p||{x:X0,y:Y0,vx:spd*5,vy:0};

    if(Math.hypot(P.vx,P.vy)>1)arrow(P.x,P.y,-P.vy*f*sc,P.vx*f*sc,COL.cor,7);
    arrow(P.x,P.y,P.vx*.25,P.vy*.25,COL.vel,4);
    ctx.font='40px serif';ctx.textAlign='center';ctx.fillText('🎈',P.x,P.y+14);
    // 저울
    const cor=Math.hypot(P.vx,P.vy)*f,bx=W-250,by=70;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(bx-10,by-10,240,80,16);ctx.fill();
    txt('기압 경도력',bx,by+14,COL.pgf,16,'left',false);ctx.fillStyle=COL.pgf;ctx.beginPath();ctx.roundRect(bx+90,by+2,Math.min(130,G*.6),14,7);ctx.fill();
    txt('전향력',bx,by+46,COL.cor,16,'left',false);ctx.fillStyle=COL.cor;ctx.beginPath();ctx.roundRect(bx+90,by+34,Math.min(130,cor*.6),14,7);ctx.fill();
    txt('속도 '+Math.round(Math.hypot(P.vx,P.vy)/5)+' m/s',bx+228,by+90,'#8b5cf6',18,'right');
  };
  function win(){confetti(20);
    const msgs=['성공! 🎉 두 힘(빨강·파랑)의 길이가 <b>똑같을 때</b> 풍선이 등압선을 따라 똑바로 날아갔어!',
      '성공! 등압선이 촘촘하면 기압 경도력이 세지니까, 전향력도 세져야 해 → <b>더 빠른 바람</b>! 💨',
      '성공! 높은 위도는 전향력이 원래 세니까 <b>더 느린 속도</b>로도 균형이 맞아! 🐧'];
    say(msgs[li],'wow');
    $('fm').style.display='block';
    $('fm').innerHTML='<b>균형 조건</b><br><span style="color:#f43f5e">기압 경도력</span> = <span style="color:#3b82f6">전향력</span><br>기압 경도력 = 2Ω sinφ · <b>v</b><br>⇒ <b style="font-size:22px">v = 기압 경도력 ÷ 2Ω sinφ</b>'+
      ['','<br><small>📌 기압 경도력 ↑ → v ↑</small>','<br><small>📌 기압 경도력 ↑ → v ↑ / 위도(φ) ↑ → v ↓</small>'][li];
    setTimeout(()=>{if(cur!==1||!$('lname'))return;li++;if(li<3){setL();say(li===1?'Lv2! 이번엔 등압선이 <b>촘촘해</b>. 빨간 화살표가 길어졌지? 속도는 어떻게 해야 할까?':'Lv3! 이번엔 <b>높은 위도</b> 하늘이야. 기압 경도력은 Lv1과 같아. 속도는?');}
      else clearStage(tries<=4?3:tries<=8?2:1,'<b>지균풍</b> : 기압 경도력 = 전향력 → 등압선과 나란히!<br>v = 기압 경도력 ÷ 2Ω sinφ');},2600);}
}

/* ============ STAGE 3 · 궤도 레이스 (경도풍) ============ */
function stage3(){
  const G=.6,f=1,r0=4,U=50,cx=W/2,cy=H/2;
  let mode='low',spd=30,p=null,rec={low:null,high:null},rankDone=false;
  $('goal').innerHTML='🎯 <b>미션</b> : 둥근 트랙을 한 바퀴! 트랙에서 벗어나지 않는 <b>출발 속도</b>를 찾아라. 🌀저기압 트랙과 ☀️고기압 트랙 모두 성공하면 클리어! (두 트랙의 기압 경도력 크기는 같아요)';
  $('ctrl').innerHTML=`<div class="row"><button class="tog on" id="tL">🌀 저기압 트랙</button><button class="tog" id="tH">☀️ 고기압 트랙</button></div>
   <label>출발 속도</label><input type="range" id="spd" min="15" max="45" step="0.5" value="30"><div class="val" id="spdT">30 m/s</div>
   <button class="big" id="go3">🏎️ 출발!</button>${legend(['pgf','cor','cen','vel'])}
   <div class="formula" id="board">🏁 <b>기록판</b><br>🌀 저기압 트랙 : <b id="rL">?</b><br>📏 곧은 길(지균풍) : <b>30 m/s</b><br>☀️ 고기압 트랙 : <b id="rH">?</b></div>`;
  say('곧은 길에서는 30 m/s로 균형이었어(지균풍). 둥근 길에서도 30 m/s면 될까? 일단 달려 보자! 🏎️');
  const setM=m=>{mode=m;$('tL').classList.toggle('on',m==='low');$('tH').classList.toggle('on',m==='high');p=null;};
  $('tL').onclick=()=>setM('low');$('tH').onclick=()=>setM('high');
  $('spd').oninput=e=>{spd=+e.target.value;$('spdT').textContent=spd+' m/s';p=null;};
  $('go3').onclick=()=>{tries++;setTry();const s=mode==='low'?1:-1;
    p={x:r0,y:0,vx:0,vy:-s*spd/50,ang:0,pa:0,dev:0,end:false,tr:[]};};
  frame=dt=>{
    const s=mode==='low'?1:-1;
    if(p&&!p.end){
      for(let i=0;i<50;i++){const h=dt*5.5/50;
        const r=Math.hypot(p.x,p.y),ux=p.x/r,uy=p.y/r;
        const ax=-s*G*ux+f*(-p.vy), ay=-s*G*uy+f*p.vx;
        p.vx+=ax*h;p.vy+=ay*h;p.x+=p.vx*h;p.y+=p.vy*h;
        const a=Math.atan2(p.y,p.x);let d=a-p.pa;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;p.ang+=Math.abs(d);p.pa=a;
        p.dev=Math.max(p.dev,Math.abs(Math.hypot(p.x,p.y)-r0)/r0);}
      p.tr.push([p.x,p.y]);
      if(p.dev>.09){p.end=true;const r=Math.hypot(p.x,p.y);
        const out=r>r0;say(out?`트랙 <b>바깥</b>으로 튕겨 나갔어! 🙀 바깥으로 끄는 힘이 너무 셌어. `+(s===1?'저기압에선 바깥쪽 힘이 <b>전향력</b>! 전향력을 줄이려면 속도를 <b>낮춰</b> 봐.':'고기압에선 바깥쪽 힘이 <b>기압 경도력</b>. 안쪽으로 끄는 전향력을 키우려면 속도를 <b>올려</b> 봐!'):
          `트랙 <b>안쪽</b>으로 말려 들어갔어! 🌀 `+(s===1?'안쪽으로 끄는 기압 경도력을 전향력이 못 버텼어. 속도를 <b>올려</b> 봐.':'안쪽으로 끄는 전향력이 너무 셌어. 속도를 <b>낮춰</b> 봐.'),'sad');}
      else if(p.ang>=2*Math.PI){p.end=true;
        if(p.dev<=.022){rec[mode]=spd;$(mode==='low'?'rL':'rH').textContent=spd+' m/s ✅';confetti(18);
          say(`한 바퀴 성공!! 🏆 ${mode==='low'?'저기압':'고기압'} 트랙 기록 <b>${spd} m/s</b>! `+(rec.low&&rec.high?'기록판을 봐! 누가 제일 빨라?':'이제 다른 트랙도 도전!'),'wow');
          if(rec.low&&rec.high&&!rankDone)setTimeout(()=>{if(cur===2&&$('rL'))rank();},1600);}
        else say('아슬아슬하게 돌긴 했는데 트랙에서 조금 흔들렸어! 속도를 살짝만 조정해 보자 😅');}
    }
    sky('#fdf2f8','#fff7ed');
    // 등압선
    for(let i=1;i<=5;i++){ctx.strokeStyle='#c4b5fd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,i*U,0,7);ctx.stroke();}
    // 트랙
    ctx.strokeStyle='#64748b';ctx.lineWidth=26;ctx.beginPath();ctx.arc(cx,cy,r0*U,0,7);ctx.stroke();
    ctx.strokeStyle='#fde047';ctx.lineWidth=3;ctx.setLineDash([14,12]);ctx.beginPath();ctx.arc(cx,cy,r0*U,0,7);ctx.stroke();ctx.setLineDash([]);
    for(let k=0;k<4;k++){ctx.fillStyle=k%2?'#fff':'#1e293b';ctx.fillRect(cx+r0*U-13+k*6.5,cy-3,6.5,6);}
    const big=s===1?'🌀':'☀️';ctx.font='60px serif';ctx.textAlign='center';ctx.fillText(big,cx,cy+20);
    txt(s===1?'저기압 L':'고기압 H',cx,cy+52,s===1?'#e11d48':'#2563eb',22,'center');
    txt(s===1?'저기압 트랙 · 반시계 방향':'고기압 트랙 · 시계 방향',20,36,'#7c3aed',24);
    // 궤적
    if(p&&p.tr.length){ctx.strokeStyle='#f472b6';ctx.lineWidth=5;ctx.beginPath();p.tr.forEach(([x,y],i)=>i?ctx.lineTo(cx+x*U,cy+y*U):ctx.moveTo(cx+x*U,cy+y*U));ctx.stroke();}
    const P=p||{x:r0,y:0,vx:0,vy:-s*spd/50};
    const r=Math.hypot(P.x,P.y),ux=P.x/r,uy=P.y/r,X=cx+P.x*U,Y=cy+P.y*U,A=120;
    const pg=[-s*G*ux,-s*G*uy],co=[-f*P.vy,f*P.vx];
    arrow(X,Y,pg[0]*A,pg[1]*A,COL.pgf,7);arrow(X,Y,co[0]*A,co[1]*A,COL.cor,7);
    arrow(X,Y,(pg[0]+co[0])*A*3,(pg[1]+co[1])*A*3,COL.cen,4);
    arrow(X,Y,P.vx*90,P.vy*90,COL.vel,4);
    cloud(X,Y,1.1);
    txt('노란 화살표(합력)가 트랙 안쪽을 향해야 돌 수 있어요',20,H-16,'#b45309',17);
  };
  function rank(){rankDone=true;
    modal(`<h2>🏆 순위를 맞혀 봐!</h2><p>기압 경도력이 같을 때, <b>가장 빠른 바람</b>부터 순서대로 눌러요.</p>
     <div style="display:flex;flex-direction:column;gap:8px" id="rk">
     <button class="opt" data-k="L">🌀 저기압성 경도풍</button><button class="opt" data-k="G">📏 지균풍</button><button class="opt" data-k="H">☀️ 고기압성 경도풍</button></div><p id="rkm"></p>`);
    const ans=['H','G','L'];let pos=0;
    document.querySelectorAll('#rk .opt').forEach(b=>b.onclick=()=>{if(b.classList.contains('right'))return;
      if(b.dataset.k===ans[pos]){b.classList.add('right');b.innerHTML=(pos+1)+'등 · '+b.innerHTML;pos++;
        if(pos===3){$('rkm').innerHTML=`<div class="formula" style="text-align:left;font-size:16px">
          <b>왜 그럴까? (화살표를 떠올려 봐!)</b><br>둥글게 돌려면 <b>안쪽으로 향하는 합력</b>(구심력)이 필요해요.<br>
          🌀 <b>저기압</b>: 안쪽 = 기압 경도력 → <b>기압 경도력 &gt; 전향력</b><br>&nbsp;&nbsp;→ 전향력이 작아도 됨 → <b>느린 바람</b><br>
          ☀️ <b>고기압</b>: 안쪽 = 전향력 → <b>전향력 &gt; 기압 경도력</b><br>&nbsp;&nbsp;→ 전향력이 커야 함 → <b>빠른 바람</b><br>
          ✨ <b>고기압성 경도풍 &gt; 지균풍 &gt; 저기압성 경도풍</b></div><button class="big green" id="rkok">알겠어! ▶</button>`;
          $('rkok').onclick=()=>clearStage(tries<=6?3:tries<=11?2:1,'둥근 등압선을 따라 부는 바람 = <b>경도풍</b><br>고기압성 &gt; 지균풍 &gt; 저기압성');}
      }else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);$('rkm').textContent='기록판의 속도를 다시 봐! 👀';}
    });}
}

/* ============ STAGE 4 · 땅 위의 바람 (지상풍) ============ */
function stage4(){
  const G=60,f=.6,K={up:0,sea:.2,land:.45};
  const NAME={up:'☁️ 높은 하늘 (마찰 없음)',sea:'🌊 바다 위 (마찰 조금)',land:'🏙️ 도시·육지 (마찰 많이)'};
  const ANG=[0,18,37];
  const order=['up','sea','land'].sort(()=>Math.random()-.5);
  let phase='A',ai=0,surf=order[0],answered=false,firstOK=0,qtry=0,ps=[],puffs=[],spawn=0,tt=0,ptStep=0,mistakes=0;
  $('goal').innerHTML='🎯 <b>미션</b> : 이제 땅 근처로 내려왔어요! 땅은 바람을 붙잡아요(<b>마찰력</b>). 장소마다 진짜 바람의 방향을 맞혀라! 🔍';
  const thetaOf=k=>Math.atan2(k,f);
  function steady(k){const V=G/Math.hypot(f,k),th=thetaOf(k);return {vx:V*Math.cos(th),vy:-V*Math.sin(th)};}
  function setupA(){surf=order[ai];answered=false;qtry=0;const v=steady(K[surf]);ps=[{x:90,y:H/2+60,vx:v.vx,vy:v.vy,tr:[]}];
    $('ctrl').innerHTML=`<div class="lv">${order.map((_,i)=>`<span class="${i<ai?'ok':i===ai?'cur':''}">${i<ai?'✓':i+1}</span>`).join('')}</div>
     <div style="text-align:center;font-size:22px">${NAME[surf]}</div><p style="font-size:17px">이곳에서 진짜 바람은 ①②③ 중 어느 것일까?</p>
     <div class="row">${[0,1,2].map(i=>`<button class="tog" data-i="${i}" style="font-size:22px">${'①②③'[i]}</button>`).join('')}</div>${legend(['pgf','cor','fri','vel'])}`;
    document.querySelectorAll('#ctrl .tog').forEach(b=>b.onclick=()=>{if(answered)return;tries++;setTry();qtry++;
      const want=surf==='up'?0:surf==='sea'?1:2;
      if(+b.dataset.i===want){answered=true;b.classList.add('on');if(qtry===1)firstOK++;else mistakes++;
        say(['정답! 마찰이 없으면 두 힘이 균형 → <b>등압선과 나란히</b> (지균풍) 😎','정답! 바다는 마찰이 조금 → 바람이 조금 느려지고 <b>저기압 쪽으로 살짝</b> 기울어 🌊','정답! 육지는 마찰이 커서 → 많이 느려지고 <b>저기압 쪽으로 크게</b> 기울어 🏙️'][want]+
          '<br><small>초록 화살표(마찰력)는 바람의 <b>반대쪽</b>! 바람이 느려지면 파란 전향력이 약해져서 빨간 기압 경도력이 이겨 → 저기압 쪽으로!</small><br><button class="big blue" id="nx" style="margin-top:8px;font-size:18px;padding:10px 20px">다음 ▶</button>','wow');
        $('nx').onclick=()=>{ai++;if(ai<3)setupA();else setupB();};}
      else{b.classList.add('wrong');say('음… 다시 생각해 봐! 마찰이 있으면 바람이 느려지고 → 전향력은? 🤔','sad');}
    });
    say(`${NAME[surf]}! 왼쪽 화면의 화살표 ①②③ 중 진짜 바람을 골라 봐. 빨간 화살표가 저기압(위) 쪽을 가리키고 있어.`);
  }
  const BQ=[{c:'low',q:'🌀 지상 저기압! 바람이 모이는 중심에서 공기는 어디로 갈까?',o:['⬆ 위로 올라간다','⬇ 아래로 내려간다'],a:0,
             e:'정답! 사방에서 모여든 공기는 갈 곳이 <b>위</b>뿐! → <b>상승 기류</b> → 구름이 생겨요 ☁️ (왜 구름이 생길까? → 3차시!)'},
            {c:'high',q:'☀️ 지상 고기압! 바람이 사방으로 퍼져 나가요. 빈자리는 어디서 채워질까?',o:['⬆ 아래에서 올라온다','⬇ 위에서 내려온다'],a:1,
             e:'정답! 위에서 공기가 <b>내려와</b> 채워요 → <b>하강 기류</b> → 맑은 날씨 ☀️'}];
  let bi=0,bAns=false;
  function setupB(){phase='B';ps=[];puffs=[];spawn=0;bAns=false;const Q=BQ[bi];
    $('ctrl').innerHTML=`<div style="text-align:center;font-size:21px">${Q.c==='low'?'🌀 저기압 관찰':'☀️ 고기압 관찰'} (육지)</div><p style="font-size:17px">${Q.q}</p>
      <div style="display:flex;flex-direction:column;gap:8px">${Q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    say(Q.c==='low'?'지상 저기압 주변의 바람을 봐! 반시계 방향으로 돌면서… 어디로 모이고 있지? 👀':'이번엔 지상 고기압! 시계 방향으로 돌면서 바람이 어떻게 움직이지? 👀');
    document.querySelectorAll('#ctrl .opt').forEach(b=>b.onclick=()=>{if(bAns)return;tries++;setTry();
      if(+b.dataset.i===Q.a){bAns=true;b.classList.add('right');if(!b.dataset.miss)firstOK++;say(Q.e+`<br><button class="big blue" id="nx" style="margin-top:8px;font-size:18px;padding:10px 20px">${bi===0?'다음 ▶':'클리어! 🎉'}</button>`,'wow');
        $('nx').onclick=()=>{bi++;if(bi<2)setupB();else clearStage(firstOK>=5?3:firstOK>=3?2:1,'<b>지상풍</b> : 기압 경도력 + 전향력 + 마찰력<br>마찰 → 느려짐 → 저기압 쪽으로 기울어 <b>저기압은 모이고(상승)</b>, <b>고기압은 퍼진다(하강)</b>');};}
      else{b.classList.add('wrong');document.querySelectorAll('#ctrl .opt').forEach(x=>x.dataset.miss=1);say('바람 입자들이 어디로 가는지 다시 봐! 👀','sad');}
    });}
  setupA();
  const cx=W/2,cy=H/2;
  frame=dt=>{tt+=dt;
    const k=phase==='A'?K[surf]:K.land;
    if(phase==='A'){
      sky(surf==='up'?'#e0f2fe':'#f0f9ff',surf==='up'?'#f0f9ff':surf==='sea'?'#bae6fd':'#fde68a');
      if(surf==='sea'){ctx.fillStyle='rgba(56,189,248,.25)';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc((i*90+tt*30)%W,H-30-(i%3)*40,30,Math.PI,0);ctx.fill();}}
      if(surf==='land'){ctx.font='40px serif';['🏢','🌳','🏠','🏬','🌳','🏢','🏠','🌲','🏬','🏢'].forEach((e,i)=>ctx.fillText(e,40+i*90,H-20-(i%2)*30));}
      txt('🌀 저기압 쪽',W/2,34,'#e11d48',24,'center');txt('☀️ 고기압 쪽',W/2,H-60,'#2563eb',22,'center');
      for(let i=-2;i<=2;i++){const y=H/2+i*100;ctx.strokeStyle='#93c5fd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();txt((1008-i*4)+' hPa',10,y-6,'#60a5fa',15);}
      const p=ps[0];
      if(answered){
        for(let i=0;i<6;i++){const h=dt/6;const ax=f*(-p.vy)-k*p.vx,ay=-G+f*p.vx-k*p.vy;p.vx+=ax*h;p.vy+=ay*h;p.x+=p.vx*h;p.y+=p.vy*h;}
        p.tr.push([p.x,p.y]);if(p.x>W-30||p.y<60){const v=steady(k);Object.assign(p,{x:90,y:H/2+60,vx:v.vx,vy:v.vy,tr:[]});}
        ctx.strokeStyle='#f472b6';ctx.lineWidth=5;ctx.setLineDash([2,10]);ctx.lineCap='round';ctx.beginPath();p.tr.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([]);
        const A=1.3;arrow(p.x,p.y,0,-G*A,COL.pgf,7);arrow(p.x,p.y,-p.vy*f*A,p.vx*f*A,COL.cor,7);if(k)arrow(p.x,p.y,-p.vx*k*A,-p.vy*k*A,COL.fri,7);arrow(p.x,p.y,p.vx*.7,p.vy*.7,COL.vel,4);
        cloud(p.x,p.y,1.2);
        const ang=Math.round(Math.atan2(-p.vy,p.vx)*180/Math.PI),V=Math.round(Math.hypot(p.vx,p.vy)/3.33);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(W-250,64,230,62,14);ctx.fill();
        txt(`등압선과 각도 ${ang}°`,W-238,90,'#7c3aed',19,'left',false);txt(`풍속 ${V} m/s`,W-238,116,'#7c3aed',19,'left',false);
      }else{
        const ox=W/2-80,oy=H/2+40;
        [0,1,2].forEach(i=>{const a=ANG[i]*Math.PI/180;arrow(ox,oy,210*Math.cos(a),-210*Math.sin(a),['#a78bfa','#f472b6','#fb923c'][i],6);
          txt('①②③'[i],ox+240*Math.cos(a),oy-240*Math.sin(a)+8,['#7c3aed','#db2777','#ea580c'][i],30,'center');});
        cloud(ox,oy,1.4);
      }
    }else{
      const Q=BQ[bi],s=Q.c==='low'?1:-1;
      sky(s===1?'#e0e7ff':'#fef9c3','#fde68a');
      for(let i=1;i<=5;i++){ctx.strokeStyle='#a5b4fc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,i*55,0,7);ctx.stroke();}
      spawn-=dt;if(spawn<=0&&ps.length<55){spawn=.12;const a=Math.random()*6.283,R=s===1?280:28;
        const V=G/Math.hypot(f,k),th=thetaOf(k);
        const tx=s===1?Math.sin(a):-Math.sin(a), ty=s===1?-Math.cos(a):Math.cos(a); // 저기압 반시계 / 고기압 시계 (화면 기준)
        const nx=-s*Math.cos(a),ny=-s*Math.sin(a); // 저기압 안쪽 / 고기압 바깥쪽
        ps.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),vx:V*(Math.cos(th)*tx+Math.sin(th)*nx),vy:V*(Math.cos(th)*ty+Math.sin(th)*ny),tr:[]});}
      ps.forEach(p=>{for(let i=0;i<4;i++){const h=dt/4;const dx=p.x-cx,dy=p.y-cy,r=Math.hypot(dx,dy)||1;
          const ax=-s*G*dx/r+f*(-p.vy)-k*p.vx, ay=-s*G*dy/r+f*p.vx-k*p.vy;p.vx+=ax*h;p.vy+=ay*h;p.x+=p.vx*h;p.y+=p.vy*h;}
        p.tr.push([p.x,p.y]);if(p.tr.length>40)p.tr.shift();});
      if(s===1)ps=ps.filter(p=>{if(Math.hypot(p.x-cx,p.y-cy)<24){puffs.push({x:cx+(Math.random()-.5)*40,t:0});return false;}return true;});
      else ps=ps.filter(p=>Math.hypot(p.x-cx,p.y-cy)<300);
      ps.forEach(p=>{ctx.strokeStyle='rgba(236,72,153,.55)';ctx.lineWidth=3;ctx.beginPath();p.tr.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
        ctx.fillStyle='#ec4899';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();});
      ctx.font='56px serif';ctx.textAlign='center';ctx.fillText(s===1?'🌀':'☀️',cx,cy+20);
      txt(s===1?'저기압 L · 반시계로 돌며 모여요':'고기압 H · 시계 방향으로 돌며 퍼져요',20,36,s===1?'#e11d48':'#2563eb',24);
      if(bAns){
        if(s===1){puffs.forEach(u=>u.t+=dt);puffs=puffs.filter(u=>u.t<1.6);
          puffs.forEach(u=>{ctx.globalAlpha=1-u.t/1.6;txt('⬆',u.x,cy-20-u.t*90,'#6366f1',30,'center');ctx.globalAlpha=1;});
          for(let i=0;i<3;i++)cloud(cx-60+i*60,cy-150+Math.sin(tt*2+i)*5,1.6,i===1);
          txt('상승 기류 → 구름! ☁️',cx,cy-200,'#4f46e5',24,'center');}
        else{for(let i=0;i<3;i++)txt('⬇',cx-40+i*40,cy-120+((tt*80+i*30)%80),'#f59e0b',30,'center');txt('하강 기류 → 맑음! ☀️',cx,cy-180,'#d97706',24,'center');}
      }
    }
  };
}
</script>
